[pytest]
asyncio_mode = auto
testpaths = tests
addopts =
    --cov=module1
    --cov=module2
    --cov=module3
    --cov=module4
    --cov=module5
    --cov=module6
    --cov=module7
    --cov-report=term-missing
    --cov-report=html:coverage_html
    --cov-fail-under=85
    -v
    --tb=short
log_cli = true
log_cli_level = WARNING
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
